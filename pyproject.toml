[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-spam-classifier"
version = "0.1.0"
description = "A 2026 rebuild of a 2016 SVM spam classifier using TF-IDF + linear models and transformer embeddings, served via FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Wei" }]
keywords = ["spam-classification", "nlp", "fastapi", "scikit-learn", "sentence-transformers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.3,<2.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "scipy>=1.11,<2.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0,<4.0",
    "torch>=2.2,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.1",
    "types-requests",
]

[project.scripts]
espam-train = "email_spam_classifier.train:main"
espam-serve = "email_spam_classifier.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/email_spam_classifier"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]
# B008: FastAPI's Depends()-in-default-argument pattern.
# N806: X_train/X_test/y_train/y_test are standard scikit-learn naming conventions.
ignore = ["B008", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["email_spam_classifier"]

[tool.ruff.lint.per-file-ignores]
# scikit-learn convention: X (feature matrix) and C (regularization strength)
# are the standard, documented parameter names.
"src/email_spam_classifier/models/embedding.py" = ["N803"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["^tests/", "^scripts/"]

[[tool.mypy.overrides]]
module = "email_spam_classifier.models.embedding"
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
